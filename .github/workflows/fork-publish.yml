name: Publish fork release

# release.yml uploads each platform to a pre-release as it finishes. Panels only
# look at releases/latest, so flipping the release once every build has succeeded
# keeps servers from ever seeing a half-uploaded version.
on:
  workflow_run:
    workflows: ["Release 3X-UI"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Mark the release as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
